<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>IRIS Network Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Terminal Header -->
<h1>IRIS Network // Secure Communication Node</h1>

<!-- Chatbox -->
<div id="chatbox">

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Input -->
    <div id="input-area">
        <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                autocomplete="off"
        >
        <button onclick="sendMessage()">Send message</button>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
